[package]
name = "haley_rust_core"
version = "1.0.0"
edition = "2021"
description = "High-performance Rust core for the Haley autonomous coding agent: scheduler, queues, monitoring, events, rate limiting, fast serialization, worker coordination, log processing, file indexing."
license = "MIT"

[lib]
name = "haley_rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
once_cell = "1.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "scheduler_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
