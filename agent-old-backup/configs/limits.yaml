# Execution settings (per ahsan's order: NO sandbox, NO resource limits,
# NO rules engine — direct execution, only 5 hard denials enforced)
python_timeout: 60
shell_timeout: 60
max_iterations: 10
tool_timeout_default: 60

# Destructive-action confirmation (ahsan's toggle, default ON)
# Set to true to allow rm -rf etc. without per-command approval
allow_destructive: false
